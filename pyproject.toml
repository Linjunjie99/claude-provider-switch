[project]
name = "claude-provider-switch"
version = "0.1.0"
description = "Switch Claude Code API provider (base URL + token) without touching other settings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ccp = "claude_provider_switch.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_provider_switch"]
